
spring.application.name=aerosaga-backend

server.port=8080

# Temporal Configuration
temporal.service.address=127.0.0.1:7233
temporal.task-queue=DRONE_MISSION_TASK_QUEUE

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aerosaga
spring.datasource.username=temporal
spring.datasource.password=temporal
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
